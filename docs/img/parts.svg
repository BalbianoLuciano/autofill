<svg xmlns="http://www.w3.org/2000/svg" width="900" height="208" viewBox="0 0 900 208" role="img" aria-label="The three parts: dictionary, engine and memory">
  <defs>
    <clipPath id="a"><rect x="0" y="0" width="284" height="208" rx="12"/></clipPath>
    <clipPath id="b"><rect x="308" y="0" width="284" height="208" rx="12"/></clipPath>
    <clipPath id="c"><rect x="616" y="0" width="284" height="208" rx="12"/></clipPath>
  </defs>

  <!-- dictionary -->
  <g clip-path="url(#a)">
    <rect x="0" y="0" width="284" height="208" fill="#17181c"/>
    <rect x="0" y="0" width="284" height="32" fill="#26282d"/>
    <rect x="0" y="31" width="284" height="1" fill="#0d0e11"/>
    <circle cx="16" cy="16" r="4.5" fill="#ff5f57"/>
    <circle cx="32" cy="16" r="4.5" fill="#febc2e"/>
    <circle cx="48" cy="16" r="4.5" fill="#28c840"/>
    <text x="142" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#868c96">fields.ts</text>
    <text x="20" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#e4e6ea">Dictionary</text>
    <text x="20" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">38 profile fields</text>
    <text x="20" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">399 ways to ask for them</text>
    <text x="20" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">en · es · fr · de · pt</text>
    <rect x="20" y="168" width="150" height="3" rx="1.5" fill="#30d158" opacity="0.55"/>
  </g>
  <rect x="0.5" y="0.5" width="283" height="207" rx="12" fill="none" stroke="#2c2f36"/>

  <!-- engine -->
  <g clip-path="url(#b)">
    <rect x="308" y="0" width="284" height="208" fill="#17181c"/>
    <rect x="308" y="0" width="284" height="32" fill="#26282d"/>
    <rect x="308" y="31" width="284" height="1" fill="#0d0e11"/>
    <circle cx="324" cy="16" r="4.5" fill="#ff5f57"/>
    <circle cx="340" cy="16" r="4.5" fill="#febc2e"/>
    <circle cx="356" cy="16" r="4.5" fill="#28c840"/>
    <text x="450" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#868c96">engine.ts</text>
    <text x="328" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#e4e6ea">Engine</text>
    <text x="328" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">matcher — finds the field</text>
    <text x="328" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">resolve — picks the value</text>
    <text x="328" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">filler  — types it, React-safe</text>
    <rect x="328" y="168" width="150" height="3" rx="1.5" fill="#0a84ff" opacity="0.55"/>
  </g>
  <rect x="308.5" y="0.5" width="283" height="207" rx="12" fill="none" stroke="#2c2f36"/>

  <!-- memory -->
  <g clip-path="url(#c)">
    <rect x="616" y="0" width="284" height="208" fill="#17181c"/>
    <rect x="616" y="0" width="284" height="32" fill="#26282d"/>
    <rect x="616" y="31" width="284" height="1" fill="#0d0e11"/>
    <circle cx="632" cy="16" r="4.5" fill="#ff5f57"/>
    <circle cx="648" cy="16" r="4.5" fill="#febc2e"/>
    <circle cx="664" cy="16" r="4.5" fill="#28c840"/>
    <text x="758" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#868c96">storage.ts</text>
    <text x="636" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#e4e6ea">Memory</text>
    <text x="636" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">your profile, on device</text>
    <text x="636" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">mappings learned per host</text>
    <text x="636" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b919b">no backend, no telemetry</text>
    <rect x="636" y="168" width="150" height="3" rx="1.5" fill="#bf5af2" opacity="0.55"/>
  </g>
  <rect x="616.5" y="0.5" width="283" height="207" rx="12" fill="none" stroke="#2c2f36"/>
</svg>
